<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto Battler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Auto Battler</h1>
    <nav class="tabs">
      <button class="tab" type="button" data-view="battle" aria-selected="true">対戦</button>
      <button class="tab" type="button" data-view="team" aria-selected="false">チーム編成</button>
      <button class="tab" type="button" data-view="piece" aria-selected="false">駒作成</button>
      <button class="tab" type="button" data-view="data" aria-selected="false">データ一覧</button>
    </nav>
  </header>

  <main>
    <div id="view-battle">
      <section class="panel match-setup">
        <label>チームA <select id="team-a"></select></label>
        <label>チームB <select id="team-b"></select></label>
        <label>シード <input id="seed" type="number" value="1" min="0" step="1">
          <button id="seed-random" type="button" title="ランダムなシードにする">🎲</button></label>
        <label>速度
          <select id="speed">
            <option value="0.5">0.5倍</option>
            <option value="1" selected>1倍</option>
            <option value="2">2倍</option>
            <option value="4">4倍</option>
            <option value="8">8倍</option>
          </select>
        </label>
        <div class="buttons">
          <button id="start" type="button" class="primary">対戦開始</button>
          <button id="pause" type="button" disabled>一時停止</button>
          <button id="skip" type="button" disabled>結果までスキップ</button>
        </div>
        <ul id="setup-errors" class="errors"></ul>
      </section>

      <section id="arena" class="arena">
        <div class="arena-top">
          <div class="side-head side-head--a">
            <div id="name-a" class="side-name"></div>
            <div id="hpbar-a" class="hpbar"><div id="hp-fill-a" class="hpbar-fill"></div><span id="hp-text-a" class="hpbar-text"></span></div>
            <div id="status-a" class="status"></div>
          </div>
          <div class="clock">
            <div id="clock-text">0.00 / 30.00 秒</div>
            <progress id="clock" max="30" value="0"></progress>
          </div>
          <div class="side-head side-head--b">
            <div id="name-b" class="side-name"></div>
            <div id="hpbar-b" class="hpbar"><div id="hp-fill-b" class="hpbar-fill"></div><span id="hp-text-b" class="hpbar-text"></span></div>
            <div id="status-b" class="status"></div>
          </div>
        </div>

        <div class="arena-boards">
          <div class="side-board">
            <div id="board-a" class="board-wrap"></div>
            <div id="info-a" class="panel unit-info"></div>
          </div>
          <div class="side-board">
            <div id="board-b" class="board-wrap"></div>
            <div id="info-b" class="panel unit-info"></div>
          </div>
        </div>

        <div id="result" class="panel result" hidden></div>
        <ol id="log" class="log panel"></ol>
      </section>
    </div>

    <div id="view-team" hidden>
      <div class="editor-grid">
        <aside class="editor-side">
          <section class="panel">
            <h3>保存スロット</h3>
            <div id="slot-list" class="slot-list"></div>
            <div class="buttons buttons--wrap">
              <button id="team-new" type="button">新規</button>
              <button id="team-save" type="button" class="primary">選択中のスロットに保存</button>
              <button id="team-delete" type="button">削除</button>
            </div>
          </section>
          <section class="panel">
            <h3>JSON</h3>
            <div class="buttons buttons--wrap">
              <button id="json-download" type="button">ファイルに書き出す</button>
              <button id="json-copy" type="button">コピー</button>
              <button id="json-open" type="button">ファイルを読み込む</button>
              <button id="json-paste-toggle" type="button">貼り付けて読み込む</button>
            </div>
            <input id="json-file" type="file" accept=".json,application/json" hidden>
            <div id="json-paste" hidden>
              <textarea id="json-text" rows="6" spellcheck="false" placeholder="チームのJSONを貼り付け"></textarea>
              <button id="json-apply" type="button">読み込む</button>
            </div>
          </section>
          <div id="team-message" class="message"></div>
        </aside>

        <section class="editor-main">
          <div class="panel editor-head">
            <label>チーム名 <input id="team-name" type="text" maxlength="30"></label>
            <label>ボード <select id="team-board"></select></label>
            <span id="team-dirty" class="dirty" hidden>● 未保存</span>
            <div class="cost">
              <span id="cost-text"></span>
              <progress id="cost-bar" max="1" value="0"></progress>
            </div>
          </div>
          <div class="editor-body">
            <div>
              <div id="edit-board" class="board-wrap"></div>
              <p class="muted board-note">左が前（列1）。駒を選んでマスをクリックで配置、右クリックで外す</p>
            </div>
            <aside id="edit-info" class="panel"></aside>
          </div>
          <div id="edit-hover" class="panel hover-info"></div>
          <h3>駒</h3>
          <div id="palette" class="panel"></div>
          <h3>遺物 <span id="relic-count" class="muted"></span></h3>
          <div id="relic-picker" class="relic-picker"></div>
        </section>
      </div>
    </div>

    <div id="view-piece" hidden>
      <div class="editor-grid">
        <aside class="editor-side">
          <section class="panel">
            <h3>自作の駒</h3>
            <div class="buttons buttons--wrap">
              <button id="piece-new-character" type="button" class="primary">＋ キャラクター</button>
              <button id="piece-new-item" type="button" class="primary">＋ 道具</button>
            </div>
            <div id="piece-list" class="piece-list"></div>
          </section>
          <section class="panel">
            <h3>JSON</h3>
            <div class="buttons buttons--wrap">
              <button id="piece-json-download" type="button">この駒を書き出す</button>
              <button id="piece-json-copy" type="button">コピー</button>
              <button id="piece-json-all" type="button">すべて書き出す</button>
              <button id="piece-json-open" type="button">ファイルを読み込む</button>
              <button id="piece-json-paste-toggle" type="button">貼り付けて読み込む</button>
            </div>
            <input id="piece-json-file" type="file" accept=".json,application/json" hidden>
            <div id="piece-json-paste" hidden>
              <textarea id="piece-json-text" rows="6" spellcheck="false" placeholder="駒のJSONを貼り付け"></textarea>
              <button id="piece-json-apply" type="button">読み込む</button>
            </div>
          </section>
          <div id="piece-message" class="message"></div>
        </aside>

        <section id="piece-form" class="editor-main"></section>
      </div>
    </div>

    <div id="view-data" hidden>
      <section class="viewer">
        <div class="viewer-controls">
          <label>チーム
            <select id="team-select"></select>
          </label>
          <label class="check"><input type="checkbox" id="mirror"> 左右反転</label>
        </div>
        <div class="viewer-body">
          <div id="board-wrap" class="board-wrap"></div>
          <aside id="team-info" class="panel"></aside>
        </div>
        <div id="hover-info" class="panel hover-info">マスにマウスを乗せると、隣接マスと駒の詳細を表示します。</div>
      </section>

      <section>
        <h2>キャラクター</h2>
        <div class="table-wrap"><table id="character-table"></table></div>
        <h2>道具</h2>
        <div class="table-wrap"><table id="item-table"></table></div>
        <h2>遺物</h2>
        <div class="table-wrap"><table id="relic-table"></table></div>
      </section>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
